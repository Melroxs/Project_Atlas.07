<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="0.55" stop-color="#7C6CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="70" y1="40" x2="130" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E8ECF4"/>
      <stop offset="1" stop-color="#B9C2D4"/>
    </linearGradient>
    <linearGradient id="chevGrad" x1="95" y1="95" x2="105" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="#0A1628"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="88" stroke="url(#ringGrad)" stroke-width="4" opacity="0.9"/>

  <!-- Globe grid lines (behind A) -->
  <g stroke="#3B4A6B" stroke-width="1.2" opacity="0.55">
    <ellipse cx="100" cy="100" rx="72" ry="30"/>
    <ellipse cx="100" cy="100" rx="72" ry="58"/>
    <line x1="28" y1="100" x2="172" y2="100"/>
    <line x1="54" y1="52" x2="146" y2="148"/>
    <line x1="146" y1="52" x2="54" y2="148"/>
  </g>

  <!-- Compass pointers -->
  <g>
    <path d="M100 6 L107 22 L93 22 Z" fill="#00D4FF"/>
    <path d="M6 100 L22 93 L22 107 Z" fill="#00D4FF"/>
    <path d="M194 100 L178 93 L178 107 Z" fill="#A855F7"/>
    <path d="M100 194 L107 178 L93 178 Z" fill="#A855F7"/>
  </g>

  <!-- Outer arc segments -->
  <path d="M20 70 A 88 88 0 0 1 70 20" stroke="url(#arcGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M130 180 A 88 88 0 0 1 180 130" stroke="url(#arcGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- Apex triangle -->
  <path d="M100 12 L108 30 L92 30 Z" fill="#00D4FF"/>

  <!-- Stylized A -->
  <path d="M100 42 L132 158 L112 158 L104 132 L96 132 L88 158 L68 158 Z" fill="url(#metalGrad)"/>
  <!-- A crossbar -->
  <path d="M93 116 L107 116 L112 128 L88 128 Z" fill="url(#metalGrad)" opacity="0.92"/>
  <!-- Inner cutout notches on legs -->
  <path d="M98 46 L102 46 L98 60 L102 60 Z" fill="#0A1628"/>
  <path d="M100 46 L100 60 L104 60 L104 46 Z" fill="#0A1628" opacity="0"/>

  <!-- Inner chevron/arrowhead between legs -->
  <path d="M100 100 L112 132 L100 122 L88 132 Z" fill="url(#chevGrad)"/>
</svg>
